[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "games-of-ww3"
version = "0.1.0"
description = "Turn-based geopolitical simulation where AI agents control nations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ingo Giebel", email = "ingo@alpha-auriga.com"},
]
keywords = ["geopolitics", "simulation", "ai-agents", "wargame", "neo4j"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "neo4j>=5.27",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pandas>=2.2",
    "requests>=2.31",
    "filelock>=3.13",
    "google-adk>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/IngoGiebel/games-of-ww3"
Repository = "https://github.com/IngoGiebel/games-of-ww3"
Issues = "https://github.com/IngoGiebel/games-of-ww3/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gww3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
